# NinniTales — Instagram (LEARNED format mix: reels + carousels). Instagram has NO
# native scheduling, so we run at the desired POST time and publish immediately:
# `orchestrate.py --platform instagram --now 1` builds + posts ONE item per run, its
# format sampled from analyze.py's surface standings (winners.json) — as of Jul 2026
# that's reels-heavy: carousels measured reach 1-2/post on a ~0-follower account
# (never recommended), while reels got 94-205-view feed tests. The mix rebalances
# itself as the medians move.
#
# Two crons = two carousels/day:
#   13:00 UTC = 9:00 AM ET — the proven US-midday slot (audit: 94-205 views vs 1-5 in
#               the evening). DST-naive, so ~1h earlier in EST winter.
#   23:00 UTC = 7:00 PM ET — US-evening slot (replaced the 02:00 UTC / 7:30 AM IST test:
#               it measured 0-5 views/post, a dead slot; both posts now get real US
#               feed distribution).
#
# Required repo secrets:
#   INSTAGRAM_ACCESS_TOKEN_NINNITALES + INSTAGRAM_BUSINESS_ACCOUNT_ID_NINNITALES
#     (minted by connect-helper; long-lived IG token + IG user id)
#   MEDIA_REPO        — "owner/public-media-repo" (a PUBLIC repo that holds the built clips
#                       so Instagram can fetch them by URL; this repo stays private)
#   MEDIA_REPO_TOKEN  — a PAT with `repo`/contents:write on that media repo
#   SCRAPE_PROXY      — US residential proxy (scraped_cta pulls a hook clip)
#   TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID — run health + summary
# Optional (only if an IG account uses the anime_cta format):
#   AZURE_OPENAI_* + NINNITALES_IMAGE_*
#   YOUTUBE_COOKIES   — cookies.txt fallback for scraping

name: NinniTales Instagram

on:
  schedule:
    - cron: "0 13 * * *"   # 9:00 AM ET (EDT) — proven US-midday slot
    - cron: "0 23 * * *"   # 7:00 PM ET (EDT) — US-evening slot
  workflow_dispatch:

jobs:
  reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit the ledger + scrape state back
    defaults:
      run:
        working-directory: ninnitales-shorts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # yt-dlp solves YouTube's nsig JS challenge with a JS runtime; it prefers Deno.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install system + python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip -r requirements.txt
          python -m pip install --upgrade yt-dlp

      - name: Write cookies.txt (optional — only if YOUTUBE_COOKIES set)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > cookies.txt
            echo "wrote cookies.txt"
          else
            echo "no YOUTUBE_COOKIES — relying on the residential proxy alone"
          fi

      - name: Publish one Instagram Reel (immediate)
        env:
          INSTAGRAM_ACCESS_TOKEN_NINNITALES: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_NINNITALES }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID_NINNITALES: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID_NINNITALES }}
          MEDIA_REPO: ${{ secrets.MEDIA_REPO }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
          MEDIA_PREFIX: ninnitales   # per-project release bucket inside the shared media repo
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
          NINNITALES_IMAGE_DEPLOYMENT: ${{ secrets.NINNITALES_IMAGE_DEPLOYMENT }}
          NINNITALES_IMAGE_ENDPOINT: ${{ secrets.NINNITALES_IMAGE_ENDPOINT }}
          NINNITALES_IMAGE_API_KEY: ${{ secrets.NINNITALES_IMAGE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python orchestrate.py --platform instagram --now 1

      - name: Persist ledger + scrape dedupe state
        if: always()
        run: |
          FILES="analytics/ledger.json state.json assets/library/.usage.json"
          MSG="chore(ninnitales): log Instagram post + scrape state [skip ci]"
          for f in $FILES; do git add "$f" 2>/dev/null || true; done
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "$MSG"
          # Concurrent crons commit these same files. A push race used to go through
          # `git pull --rebase || true` — a same-line JSON conflict silently LOST the
          # ledger row of a published post (Jul 13 + 17). Now: domain-merge the JSON
          # against origin and re-commit on top, retrying a few times.
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            python analytics/git_merge_json.py $FILES
            git reset --soft FETCH_HEAD
            for f in $FILES; do git add "$f" 2>/dev/null || true; done
            git commit -m "$MSG"
          done
          echo "::error::persist step lost the push race 3x — ledger row NOT committed"
          exit 1
