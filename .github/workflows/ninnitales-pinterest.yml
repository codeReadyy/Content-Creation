# NinniTales — Pinterest pins via RSS AUTO-PUBLISH (publish_via: rss in accounts.yml).
# Standard API access keeps getting denied and Trial pins are sandbox-only (invisible to
# the public), so each run builds pins and appends them to per-board RSS feeds in the
# public media repo; Pinterest's native Auto-publish ingests the feeds and creates the
# real pins within 24-48h. Cron timing therefore sets when items are ADDED, not when
# pins appear. Two crons × 3 = ~6 items/day.
#
# ONE-TIME manual setup (owner): claim ninnitales.com on the Pinterest business profile,
# then paste each feed URL from `python rss_feed.py` into Pinterest → Settings →
# Bulk create Pins → Auto-publish (pick the matching board).
#
# Pins are image-only (no video), so this workflow skips ffmpeg/yt-dlp. The pin background
# is a cozy-anime image from gpt-image-1 (Azure), with a gradient fallback if that's absent.
#
# Required repo secrets:
#   MEDIA_REPO + MEDIA_REPO_TOKEN             (public media repo — hosts feeds + images;
#                                              same secrets the Instagram workflow uses)
#   AZURE_OPENAI_* + NINNITALES_IMAGE_*       (for the gpt-image-1 pin background)
#   TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID     (run health + summary)
# No PINTEREST_* secrets needed in RSS mode.

name: NinniTales Pinterest

on:
  schedule:
    - cron: "0 13 * * *"   # ~9:00 AM ET (EDT)
    - cron: "0 22 * * *"   # ~6:00 PM ET (EDT)
  workflow_dispatch:
    inputs:
      count:
        description: "How many pins to post this run"
        required: false
        default: "3"

jobs:
  pins:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit the ledger back
    defaults:
      run:
        working-directory: ninnitales-shorts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python deps
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Publish Pinterest pins (append to RSS feeds)
        env:
          MEDIA_REPO: ${{ secrets.MEDIA_REPO }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
          MEDIA_PREFIX: ninnitales
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
          NINNITALES_IMAGE_DEPLOYMENT: ${{ secrets.NINNITALES_IMAGE_DEPLOYMENT }}
          NINNITALES_IMAGE_ENDPOINT: ${{ secrets.NINNITALES_IMAGE_ENDPOINT }}
          NINNITALES_IMAGE_API_KEY: ${{ secrets.NINNITALES_IMAGE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python orchestrate.py --platform pinterest --now "${{ github.event.inputs.count || '3' }}"

      - name: Persist ledger
        if: always()
        run: |
          git add analytics/ledger.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(ninnitales): log Pinterest pins [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi
