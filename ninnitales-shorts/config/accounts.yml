# The routing table — the single source of truth for WHO posts WHAT, WHEN.
# One block per (platform, account). The orchestrator iterates these.
#
# CONVENTION: ONE FORMAT PER ACCOUNT — with a deliberate exception for accounts in
# the cold-start phase. A mature feed should have one consistent content type; to
# compare formats, run the SAME niche on TWO accounts and let analyze.py rank them
# ("ACCOUNT STANDINGS"). But an account with no audience can't afford a format the
# platform won't distribute (IG carousels at 0 followers = reach 1-2): a multi-format
# account gets its per-slot format SAMPLED from the learned surface mix
# (analytics/strategy.format_mix over winners.json), so the engine itself shifts
# toward whatever that platform actually distributes. Single-format accounts behave
# exactly as before (all slots that format, no cross-format fallback).
#
# Fields:
#   id          unique account id (used in the ledger + account standings)
#   platform    youtube | instagram | tiktok
#   product     product key (forks swap this)
#   niche       config/niches/<niche>.yml — the content profile
#   creds_env   env-var SUFFIX for creds, e.g. NINNITALES -> YOUTUBE_*_NINNITALES
#   formats     the account's format — keep it to ONE (see convention above)
#   schedule_et publish times in US Eastern; build runs ~2h before the first slot
#   gate        true = require Telegram approval first; false = fully autonomous
#   enabled     false = ignored by the orchestrator (scaffolding for later phases)

accounts:
  # 2 slots, not 3: the Jul-2026 audit showed 3 near-identical Shorts/day from a small
  # channel meant ~2 of 3 got ZERO feed impressions (repetition sampling). Fewer,
  # distinct uploads → each one actually gets its feed test.
  - id: ninnitales_yt_main
    platform: youtube
    product: ninnitales
    niche: toddler_sleep
    creds_env: NINNITALES            # -> YOUTUBE_*_NINNITALES
    formats: [scraped_cta]           # proven ~50x winner; flip to [anime_cta] to switch
    schedule_et: ["08:00", "19:00"]
    gate: false
    enabled: true

  # A/B the anime format on its OWN channel (so neither feed mixes formats). Enable
  # once a second YouTube channel exists and its creds are added as YOUTUBE_*_NINNITALES_ANIME.
  - id: ninnitales_yt_anime
    platform: youtube
    product: ninnitales
    niche: toddler_sleep
    creds_env: NINNITALES_ANIME      # -> YOUTUBE_*_NINNITALES_ANIME
    formats: [anime_cta]
    schedule_et: ["08:00", "12:30", "19:00"]
    gate: false
    enabled: false

  # IG = LEARNED format mix (this account intentionally breaks the one-format-per-
  # account convention). The carousels-only phase (Jul 4-17) measured reach 1-2/post
  # — on a ~0-follower account Instagram simply does not recommend carousels, while
  # the SAME account's reels got 94-205-view feed tests. The orchestrator now samples
  # each slot from analyze.py's surface standings (winners.json): dead surfaces keep a
  # ~20% probe share, healthy ones split by median views — so today that's reels-heavy
  # automatically, and the mix rebalances itself as soon as carousels earn reach
  # (no YAML edit needed). Revisit a two-account reels-vs-carousel split once this
  # account actually has an audience to distribute carousels to.
  # Slots: 09:00 ET (proven US-midday) + 19:00 ET (US-evening; the 7:30 AM IST test
  # slot measured 0-5 views and was dropped). On IG the cron time IS the post time
  # (--now 1) — the crons in ninnitales-instagram.yml actually drive timing; schedule_et
  # just mirrors them for the record.
  - id: instagram_ninnitales
    platform: instagram
    product: ninnitales
    niche: toddler_sleep
    creds_env: NINNITALES
    formats: [scraped_cta, carousel]   # learned per-slot mix via winners.json surfaces
    schedule_et: ["09:00", "19:00"]   # 19:00 EDT == 23:00 UTC
    gate: false
    enabled: true

  # Pinterest — evergreen image pins (one per slot), recycled across boards, published
  # via RSS AUTO-PUBLISH (publish_via: rss): Standard API access keeps getting denied and
  # Trial pins are sandbox-only, so the publisher appends items to per-board RSS feeds in
  # the public media repo and Pinterest's native Auto-publish creates the real pins within
  # 24-48h (no PINTEREST_* creds; needs MEDIA_REPO*). One-time setup: claim ninnitales.com
  # on the Pinterest profile + paste the feed URLs from `python rss_feed.py`. Timing is
  # Pinterest's ingestion cycle, so slot times just set how often items are ADDED. Flip
  # publish_via back off if Standard access is ever granted.
  - id: pinterest_ninnitales
    platform: pinterest
    product: ninnitales
    niche: toddler_sleep
    creds_env: NINNITALES            # -> PINTEREST_*_NINNITALES (unused in rss mode)
    formats: [pin]
    schedule_et: ["08:00", "11:00", "14:00", "17:00", "20:00"]
    publish_via: rss
    gate: false
    enabled: true
